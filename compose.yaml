# CSV 딥러닝 웹앱 - 기본(CPU) 실행 구성
#
#   실행:  docker compose up -d --build
#   확인:  http://127.0.0.1:8080/health
#   종료:  docker compose down            (볼륨 appdata 는 유지됨)
#
# GPU 사용은 compose.gpu.yaml 을 겹쳐서 실행한다:
#   docker compose -f compose.yaml -f compose.gpu.yaml up -d --build
#
# 테스트(컨테이너 안에서 pytest 실행)는 운영용 app 서비스가 아니라 별도 test 서비스를 쓴다.
# app(cpu-runtime/gpu-runtime)에는 pytest 등 테스트 의존성을 넣지 않기 때문이다:
#   docker compose run --build --rm test pytest -q
# test 서비스는 profiles: ["test"] 로 묶여 있어 `docker compose up`에는 절대 포함되지 않는다.

name: csv-dl-app

services:
  app:
    build:
      context: .
      target: cpu-runtime
    image: csv-dl-app:cpu
    ports:
      # 호스트 8080 -> 컨테이너 8000. 로그인이 없으므로 127.0.0.1 에만 게시한다.
      - "127.0.0.1:8080:8000"
    volumes:
      - appdata:/data          # 내부 상태(명명된 볼륨)
      - ./exports:/exports     # 사용자에게 내보내는 결과물(바인드 마운트)
    environment:
      APP_DEVICE: cpu
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # 테스트 전용 서비스. Dockerfile 의 `test` 타깃(= cpu-runtime + pytest/httpx)을 사용한다.
  # profiles 로 묶어 `docker compose up`/`up -d` 실행 시 함께 뜨지 않게 한다(app 은 항상 1개만 운영 실행).
  # 실행: docker compose run --build --rm test pytest -q
  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    image: csv-dl-app:test

volumes:
  appdata:
