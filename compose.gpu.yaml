# GPU 오버라이드: compose.yaml 위에 겹쳐서 사용한다. (서비스는 여전히 app 하나)
#
#   docker compose -f compose.yaml -f compose.gpu.yaml up -d --build
#
# CUDA wheel 인덱스는 TORCH_INDEX_URL 로 바꿀 수 있다 (예: cu126, cu128, cu130).
#   PowerShell:  $env:TORCH_INDEX_URL = "https://download.pytorch.org/whl/cu126"
# 기본값은 Dockerfile 의 기본값(cu128)과 같게 유지한다.

services:
  app:
    build:
      target: gpu-runtime
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu128}
    image: csv-dl-app:gpu
    environment:
      APP_DEVICE: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
