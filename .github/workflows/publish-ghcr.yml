name: Publish images to GHCR

# CSV 딥러닝 웹앱의 CPU/GPU 실행 이미지를 GitHub Container Registry(GHCR)에 빌드해 올린다.
# 학생 배포판(dist/)은 이 이미지를 그대로 받아서 실행하며, 이 저장소를 clone/build 하지 않는다.
#
# 실행 시점:
#   - main 브랜치에 push 될 때: :cpu, :gpu 태그와 :cpu-<짧은 SHA>, :gpu-<짧은 SHA> 태그로 올린다.
#   - v로 시작하는 태그(예: v1.0.0)를 push 할 때: 위 태그에 더해 :cpu-<태그>, :gpu-<태그> 도 올린다.
#   - Actions 탭에서 수동으로도 실행할 수 있다 (workflow_dispatch).
#
# 올라간 이미지 이름: ghcr.io/<저장소 소유자 소문자>/<저장소 이름 소문자>:cpu  및  :gpu
# dist/.env 의 APP_IMAGE 값을 이 이름에 맞춰 채워야 한다.
#
# 주의: GPU 이미지는 PyTorch CUDA wheel을 내려받아 설치하므로 빌드가 오래 걸리고(수 GB, 10분 이상 가능)
#       GitHub Actions 무료 한도에 영향을 줄 수 있다.
#
# 주의: GHCR 패키지는 기본적으로 비공개로 생성될 수 있다. 학생이 로그인 없이 pull 할 수 있도록
#       저장소의 Packages 설정에서 이미지를 Public 으로 바꿔야 한다 (최초 1회, 이 워크플로가 대신 해주지 않음).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: cpu-runtime
            tag: cpu
          - target: gpu-runtime
            tag: gpu
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 이미지 이름 준비 (GHCR은 소문자만 허용)
        id: image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Docker Buildx 준비
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 태그 목록 만들기
        id: tags
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          TAGS="${{ steps.image.outputs.name }}:${{ matrix.tag }}"
          TAGS="$TAGS,${{ steps.image.outputs.name }}:${{ matrix.tag }}-$SHORT_SHA"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAGS="$TAGS,${{ steps.image.outputs.name }}:${{ matrix.tag }}-${GITHUB_REF_NAME}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: 빌드 및 푸시 (${{ matrix.target }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
